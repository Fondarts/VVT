<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kissd Review</title>
  <link rel="stylesheet" href="./css/panel.css">
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen" class="auth-screen">
    <div style="font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 4px;">Kissd Review</div>
    <p>Sign in to view project feedback inside Photoshop.</p>
    <button id="btn-signin" class="btn btn-primary">Sign in with Google</button>
    <div id="gsi-button" style="display: none; margin-top: 12px;"></div>
    <p id="auth-error" style="color: var(--error); margin-top: 8px; font-size: 10px;"></p>
  </div>

  <!-- App screen -->
  <div id="app-screen" style="display: none; flex-direction: column; height: 100vh;">
    <!-- Header -->
    <div class="panel-header">
      <button id="btn-projects" class="btn-projects">&#9654; Projects</button>
      <div id="selected-file-label" class="selected-file-label"></div>
      <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
        <div id="user-info" class="user"></div>
        <button id="btn-signout" class="btn btn-secondary btn-sm">Sign out</button>
      </div>
    </div>

    <!-- Main content -->
    <div id="empty-state" class="comment-empty" style="padding-top: 80px;">
      Open <strong>Projects</strong> to browse files and feedback.
    </div>

    <div id="feedback-panel" class="feedback-panel" style="display:none;">
      <!-- Image viewer -->
      <div id="image-wrap" class="image-wrap">
        <img id="image-viewer" class="image-viewer" alt="">
        <canvas id="annotation-canvas" class="annotation-canvas"></canvas>
        <div id="image-error" class="image-error" style="display:none;">
          Image preview unavailable.
        </div>
      </div>
      <div id="resize-handle" class="resize-handle"></div>
      <!-- Comments -->
      <div id="comment-list" class="comment-list">
        <div class="comment-empty">No feedback on this file yet.</div>
      </div>
      <div class="status-bar">
        <span id="status-text">No comments</span>
      </div>
    </div>

    <!-- Sidebar overlay -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span>Projects</span>
        <button id="btn-sidebar-close" class="btn-sidebar-close">&#10005;</button>
      </div>
      <div id="sidebar-tree" class="sidebar-tree">
        <div class="comment-empty">Loading projects...</div>
      </div>
    </div>
  </div>

  <!-- Adobe CEP lib -->
  <script src="./js/CSInterface.js"></script>

  <!-- Firebase v9 compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Panel logic -->
  <script src="./js/panel.js"></script>
</body>
</html>
